name: quantpulse

services:
  quantpulse:
    image: quantpulse:latest
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
        PUBLIC_CORS_PROXY: ${PUBLIC_CORS_PROXY:-}
        PUBLIC_RISK_FREE_RATE: ${PUBLIC_RISK_FREE_RATE:-0}
    ports:
      - '${QUANTPULSE_PORT:-8080}:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp/nginx:size=160m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
