worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	types {
		application/manifest+json webmanifest;
	}

	log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
		'"$http_referer" "$http_user_agent" rt=$request_time cache=$upstream_cache_status';
	access_log /dev/stdout main;

	server_tokens off;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;

	client_body_temp_path /tmp/nginx/client_body;
	proxy_temp_path /tmp/nginx/proxy;
	fastcgi_temp_path /tmp/nginx/fastcgi;
	uwsgi_temp_path /tmp/nginx/uwsgi;
	scgi_temp_path /tmp/nginx/scgi;

	gzip on;
	gzip_static on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types application/json application/javascript text/css text/plain image/svg+xml application/manifest+json application/xml;

	resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
	resolver_timeout 5s;

	proxy_cache_path /tmp/nginx/cache levels=1:2 keys_zone=yahoo:10m max_size=128m inactive=10m use_temp_path=off;
	limit_req_zone $binary_remote_addr zone=yahoo_rate:10m rate=10r/s;
	limit_req_status 429;

	server {
		listen 8080;
		server_name _;
		root /usr/share/nginx/html;
		index index.html;

		location = /healthz {
			access_log off;
			default_type text/plain;
			return 200 'ok';
		}

		location ^~ /_app/immutable/ {
			include /etc/nginx/security-headers.conf;
			add_header Cache-Control "public, max-age=31536000, immutable" always;
			try_files $uri =404;
		}

		location ~* \.(?:svg|png|ico|webmanifest|txt|xml|js)$ {
			include /etc/nginx/security-headers.conf;
			add_header Cache-Control "public, max-age=86400" always;
			try_files $uri =404;
		}

		location / {
			include /etc/nginx/security-headers.conf;
			add_header Cache-Control "no-cache" always;
			try_files $uri $uri/ /200.html;
		}

		location /yf/ {
			return 403;
		}

		location ~ "^/yf/v8/finance/chart/[A-Za-z0-9.=^%-]{1,32}$" {
			limit_except GET {
				deny all;
			}
			limit_req zone=yahoo_rate burst=30 nodelay;

			set $yahoo_host query1.finance.yahoo.com;
			rewrite ^/yf/(.*)$ /$1 break;
			proxy_pass https://$yahoo_host;

			proxy_http_version 1.1;
			proxy_ssl_server_name on;
			proxy_ssl_name $yahoo_host;
			proxy_ssl_verify on;
			proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
			proxy_set_header Host $yahoo_host;
			# Yahoo throttles full browser user agents; a minimal one is accepted.
			proxy_set_header User-Agent "Mozilla/5.0";
			proxy_set_header Accept "application/json";
			proxy_set_header Accept-Encoding "";
			proxy_set_header Cookie "";
			proxy_set_header Origin "";
			proxy_set_header Referer "";
			proxy_set_header X-Forwarded-For "";
			proxy_set_header Connection "";
			proxy_hide_header Set-Cookie;
			proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
			proxy_connect_timeout 5s;
			proxy_read_timeout 15s;

			proxy_cache yahoo;
			proxy_cache_key $request_uri;
			proxy_cache_valid 200 404 60s;
			proxy_cache_lock on;
			proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

			include /etc/nginx/security-headers.conf;
			add_header Cache-Control "no-store" always;
			add_header X-Cache-Status $upstream_cache_status always;
		}
	}
}
